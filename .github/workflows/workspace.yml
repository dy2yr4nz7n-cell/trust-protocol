name: Workspace runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/workspace.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "apps/**"
      - "scripts/**"
      - "test/**"
      - "web/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/workspace.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "apps/**"
      - "scripts/**"
      - "test/**"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run workspace tests
        run: npm run test:ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build workspace image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: trust-workspace:ci-${{ github.sha }}
          build-args: |
            TARGETARCH=amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check configured container health and UI
        shell: bash
        env:
          EXPECTED_UI_TEXT: PRÜF-WORKSPACE
        run: |
          set -euo pipefail
          JWT_SECRET="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$JWT_SECRET"
          export JWT_SECRET
          docker run -d --name trust-workspace \
            -p 127.0.0.1:3000:3000 \
            -e JWT_SECRET \
            -e PUBLIC_ORIGIN=http://127.0.0.1:3000 \
            trust-workspace:ci-${{ github.sha }}
          unset JWT_SECRET
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --connect-timeout 2 --max-time 3 \
              http://127.0.0.1:3000/health \
              --output "$RUNNER_TEMP/trust-health.json"; then
              ready=true
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' trust-workspace)" != true ]; then
              echo '::error::Container exited before becoming healthy'
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo '::error::Container health endpoint did not become ready'
            exit 1
          fi
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import assert from "node:assert/strict";
            const health = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/trust-health.json", "utf8"));
            assert.equal(health.status, "ok");
            assert.equal(health.apiConfigured, true, "API must be configured");
            assert.equal(health.c2pa?.available, true, "C2PA tool must be available");
          '
          curl --fail --silent --show-error \
            --connect-timeout 2 --max-time 10 \
            http://127.0.0.1:3000/ \
            --output "$RUNNER_TEMP/trust-ui.html"
          grep -Fq "$EXPECTED_UI_TEXT" "$RUNNER_TEMP/trust-ui.html"

      - name: Capture container diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          mkdir -p ci-diagnostics
          docker logs trust-workspace > ci-diagnostics/container.log 2>&1 || true
          docker inspect --format '{{json .State}}' trust-workspace > ci-diagnostics/container-state.json 2>&1 || true

      - name: Upload container diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: workspace-runtime-diagnostics-${{ github.run_attempt }}
          path: ci-diagnostics/
          retention-days: 7
          if-no-files-found: ignore

      - name: Remove test container
        if: ${{ always() }}
        run: docker rm -f trust-workspace >/dev/null 2>&1 || true

  production-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev
